name: Bug report
description: Something broke or looks wrong in the game or in Setup
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! The quickest way to fill this in is **Report a Bug** on the game's title screen or pause menu: it fills in the build, the level and your computer for you.
        Before posting, have a look at the [known issues](../blob/main/KNOWN_ISSUES.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect to happen?
      placeholder: Atton walked through the wall in the dormitories.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where in the game?
      description: The level (filled in by the game), and the room or what you were doing.
      placeholder: 106per, the corridor past the dormitory door
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can it be made to happen again?
      placeholder: |
        1. Load the checkpoint at the dormitories
        2. Walk Atton to the door
  - type: input
    id: build
    attributes:
      label: Build
      description: Shown at the bottom right of the title screen.
      placeholder: 0.4.0-demo (data 1)
    validations:
      required: true
  - type: textarea
    id: computer
    attributes:
      label: Computer
      description: Filled in by the game; otherwise your Mac model and macOS version.
      placeholder: macOS 15.1, MacBookPro18,3, Apple M1 Pro
  - type: input
    id: mods
    attributes:
      label: Mods on
      placeholder: none
  - type: textarea
    id: files
    attributes:
      label: Screenshot and log
      description: Drag in the files from "Show files to attach" in the game's Report a Bug (log.txt, crash_log.txt, screenshot.png). The game writes your home folder as ~ in those logs.
