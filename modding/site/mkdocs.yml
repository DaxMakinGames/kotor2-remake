site_name: KOTOR 2 Remake Modding Wiki
site_description: How to make mods for the KOTOR 2 remake - hooks, items, game modes, art.
docs_dir: docs
theme:
  name: material
  palette:
    scheme: slate
    primary: black
    accent: blue grey
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
extra_css:
  - style.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
nav:
  - Home: index.md
  - Getting started:
      - Installing mods: getting-started/installing.md
      - Your first mod: getting-started/first-mod.md
      - Packing and sharing: getting-started/packing.md
      - Current limitations: getting-started/limitations.md
  - Guides:
      - Recipes: guides/recipes.md
      - Hooks explained: guides/hooks.md
      - Settings and new-game choices: guides/settings.md
      - Saving your mod's state: guides/saving.md
      - Adding items: guides/items.md
      - Conversations, quests and stores: guides/conversations.md
      - Classic KOTOR 2 mods: guides/classic-mods.md
      - Outfits and textures: guides/outfits.md
      - Texture overhauls: guides/textures.md
      - Replacing script functions: guides/script-functions.md
      - Making a game mode: guides/game-modes.md
      - Working with other mods: guides/compatibility.md
      - Testing a mod: guides/testing.md
      - Bring a KOTOR mod over: guides/porting.md
